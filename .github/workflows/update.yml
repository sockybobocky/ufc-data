name: Update UFC Data

on:
  schedule:
    - cron: '0 6 * * 1'     # Monday 6am UTC - weekly update
    - cron: '0 6 * * 5'     # Friday 6am UTC - weekly update
    - cron: '0 4 1 * *'     # 1st of every month 4am UTC - full scrape
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scrape mode'
        required: true
        default: 'update'
        type: choice
        options:
          - update
          - full

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          python -m playwright install chromium
          python -m playwright install-deps

      - name: Run scraper
        run: |
          if [ "${{ github.event.inputs.mode }}" = "full" ]; then
            echo "Running FULL scrape (manual trigger)"
            python scrape_ufc_data.py --full
          elif [ "${{ github.event.schedule }}" = "0 4 1 * *" ]; then
            echo "Running FULL scrape (monthly schedule)"
            python scrape_ufc_data.py --full
          else
            echo "Running UPDATE scrape"
            python scrape_ufc_data.py
          fi

      - name: Verify CSVs have data before committing
        run: |
          echo "=== CSV file check ==="
          ABORT=false
          for f in ufc_fighter_records.csv ufc_upcoming_events.csv; do
            if [ -f "$f" ]; then
              LINES=$(wc -l < "$f")
              SIZE=$(wc -c < "$f")
              echo "$f: $LINES lines, $SIZE bytes"
              if [ "$LINES" -le 1 ]; then
                echo "WARNING: $f appears empty (only header). Restoring from git."
                git checkout -- "$f" 2>/dev/null || echo "  Could not restore $f"
              fi
            fi
          done
          echo "=== Check complete ==="

      - name: Commit updated CSVs
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add *.csv scraper_state.json
          git diff --cached --quiet || git commit -m "Update UFC data $(date +%Y-%m-%d)"
          git push

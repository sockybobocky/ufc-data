name: Update UFC Data

on:
  schedule:
    - cron: '0 6 * * 1'     # Monday 6am UTC - weekly update
    - cron: '0 6 * * 5'     # Friday 6am UTC - weekly update
    - cron: '0 4 1 * *'     # 1st of every month 4am UTC - full scrape
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scrape mode'
        required: true
        default: 'update'
        type: choice
        options:
          - update
          - full
          - repair-sample
          - repair-broad
          - recent-audit
      repair_limit:
        description: 'Historical verification batch size'
        required: false
        default: '25'
        type: choice
        options:
          - '25'
          - '100'
      repair_offset:
        description: 'Historical verification offset (nonnegative integer)'
        required: false
        default: '0'
        type: string
      repair_batches:
        description: 'Number of bounded historical batches'
        required: false
        default: '1'
        type: choice
        options:
          - '1'
          - '5'

jobs:
  scrape:
    if: ${{ github.event.inputs.mode != 'repair-sample' && github.event.inputs.mode != 'repair-broad' && github.event.inputs.mode != 'recent-audit' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 playwright xgboost scikit-learn pandas numpy
          python -m playwright install chromium
          python -m playwright install-deps

      - name: Validate odds export
        run: python -m unittest test_odds_export

      - name: Validate scraper stage diagnostics
        run: python -m unittest test_scraper_diagnostics -v

      - name: Validate upcoming card parser
        run: python -m unittest test_upcoming_parser

      - name: Run scraper
        run: |
          if [ "${{ github.event.inputs.mode }}" = "full" ]; then
            echo "Running FULL scrape (manual trigger)"
            python run_scraper_with_diagnostics.py --full --skip-odds
          elif [ "${{ github.event.schedule }}" = "0 4 1 * *" ]; then
            echo "Running FULL scrape (monthly schedule)"
            python run_scraper_with_diagnostics.py --full --skip-odds
          else
            echo "Running UPDATE scrape"
            python run_scraper_with_diagnostics.py --skip-odds
          fi

      - name: Retain historical failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: historical-scrape-failures
          path: |
            scraper_repair_errors.json
            scraper_run_diagnostics.json
          if-no-files-found: warn
          retention-days: 14

      - name: Retrain ML models
        run: |
          echo "Retraining winner prediction model..."
          python train_model.py
          echo "Retraining distance prediction model..."
          python train_distance_model.py
          echo "Model training complete"

      - name: Verify CSVs have data before committing
        run: |
          echo "=== CSV file check ==="
          for f in ufc_fighter_records.csv ufc_upcoming_events.csv; do
            if [ -f "$f" ]; then
              LINES=$(wc -l < "$f")
              SIZE=$(wc -c < "$f")
              echo "$f: $LINES lines, $SIZE bytes"
              if [ "$LINES" -le 1 ]; then
                echo "WARNING: $f appears empty (only header). Restoring from git."
                git checkout -- "$f" 2>/dev/null || echo "  Could not restore $f"
              fi
            fi
          done
          echo "=== Check complete ==="

      - name: Commit updated data + model
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add *.csv *.json
          git diff --cached --quiet || git commit -m "Update UFC data + ML models $(date +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main

  verify-repair-sample:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'repair-sample' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scraper dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          python -m playwright install --with-deps chromium
      - name: Run parser and failure-protection tests
        run: python -m unittest test_ufcstats_parser -v
      - name: Verify five existing fights without changing source CSVs
        run: python repair_history.py --limit 5 --output repaired_sample
      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-repair-sample
          path: repaired_sample/
          if-no-files-found: warn

  verify-repair-broad:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'repair-broad' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scraper dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          python -m playwright install --with-deps chromium
      - name: Test parser and checkpoints
        run: python -m unittest test_ufcstats_parser test_backfill_history test_backfill_batches -v
      - name: Verify representative historical fights
        env:
          REPAIR_LIMIT: ${{ inputs.repair_limit || '25' }}
          REPAIR_OFFSET: ${{ inputs.repair_offset || '0' }}
          REPAIR_BATCHES: ${{ inputs.repair_batches || '1' }}
        run: python backfill_batches.py --limit "$REPAIR_LIMIT" --offset "$REPAIR_OFFSET" --batches "$REPAIR_BATCHES" --output repaired_broad
      - name: Verify resume uses completed checkpoints
        env:
          REPAIR_LIMIT: ${{ inputs.repair_limit || '25' }}
          REPAIR_OFFSET: ${{ inputs.repair_offset || '0' }}
          REPAIR_BATCHES: ${{ inputs.repair_batches || '1' }}
        run: python backfill_batches.py --limit "$REPAIR_LIMIT" --offset "$REPAIR_OFFSET" --batches "$REPAIR_BATCHES" --output repaired_broad --resume
      - name: Upload isolated verification data and checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-repair-broad
          path: repaired_broad/
          if-no-files-found: warn

  verify-recent-events:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'recent-audit' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source audit dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          python -m playwright install --with-deps chromium
      - name: Audit recent completed events without publishing
        run: python audit_recent.py
      - name: Save checksummed source pages and isolated records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recent-event-audit
          path: recent_audit/
          if-no-files-found: warn

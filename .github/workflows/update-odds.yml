name: Update published odds
on:
  schedule:
    - cron: '0 6 * * 1'
    - cron: '0 6 * * 5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: published-odds-main
  cancel-in-progress: false
jobs:
  odds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install odds HTTP dependency
        run: python -m pip install requests
      - name: Validate fixture-only odds exporter
        run: python -m unittest -v test_odds_export test_independent_odds
      - name: Collect sportsbook quotes
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python export_odds.py
      - name: Publish quote files and explicit status
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -- ufc_odds_status.json
          for file in ufc_odds_quotes.json ufc_betting_odds.csv; do
            if [ -f "$file" ]; then git add -- "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Update paired sportsbook quotes and status"
            for attempt in 1 2 3; do
              git pull --rebase origin main || exit 1
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
            done
          fi
      - name: Mark unsuccessful provider fetch
        run: python -c "import json,sys; sys.exit(0 if json.load(open('ufc_odds_status.json'))['state']=='success' else 1)"

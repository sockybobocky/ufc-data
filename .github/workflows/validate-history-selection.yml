name: Validate weekly history selection
on:
  pull_request:
    paths:
      - history_update_policy.py
      - test_history_update_policy.py
      - test_ufcstats_parser.py
      - scrape_ufc_data.py
      - .github/workflows/update.yml
      - .github/workflows/validate-history-selection.yml
permissions:
  contents: read
jobs:
  selection-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - run: python -m unittest test_history_update_policy test_ufcstats_parser test_scraper_diagnostics -v

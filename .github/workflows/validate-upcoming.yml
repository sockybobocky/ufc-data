name: Validate upcoming cards

on:
  pull_request:
    paths:
      - 'ufcstats_parser.py'
      - 'scrape_ufc_data.py'
      - 'test_upcoming_parser.py'
      - 'export_upcoming.py'
      - 'test_independent_upcoming.py'
      - '.github/workflows/update-upcoming.yml'
      - '.github/workflows/update.yml'
      - 'tests/fixtures/upcoming-five-cards.json'
      - '.github/workflows/validate-upcoming.yml'
  push:
    branches: [main]
    paths:
      - 'ufcstats_parser.py'
      - 'scrape_ufc_data.py'
      - 'test_upcoming_parser.py'
      - 'export_upcoming.py'
      - 'test_independent_upcoming.py'
      - '.github/workflows/update-upcoming.yml'
      - '.github/workflows/update.yml'
      - 'tests/fixtures/upcoming-five-cards.json'
      - '.github/workflows/validate-upcoming.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependency
        run: python -m pip install beautifulsoup4
      - name: Check source syntax
        run: python -m py_compile ufcstats_parser.py scrape_ufc_data.py test_upcoming_parser.py export_upcoming.py test_independent_upcoming.py
      - name: Verify identities and complete-card publication
        run: python -m unittest -v test_upcoming_parser test_independent_upcoming

name: Validate scraper diagnostics
on:
  pull_request:
    paths:
      - run_scraper_with_diagnostics.py
      - test_scraper_diagnostics.py
      - .github/workflows/update.yml
      - .github/workflows/validate-scraper-diagnostics.yml
  push:
    branches: [main]
    paths:
      - run_scraper_with_diagnostics.py
      - test_scraper_diagnostics.py
      - .github/workflows/update.yml
      - .github/workflows/validate-scraper-diagnostics.yml
permissions:
  contents: read
jobs:
  diagnostics-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test stage reporting and CLI delegation without scraping
        run: python -m unittest test_scraper_diagnostics -v

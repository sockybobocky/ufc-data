name: Verify scraper repair sample
on:
  workflow_dispatch:
    inputs:
      limit:
        description: Number of existing fights to verify (1-100)
        required: true
        default: '5'
        type: choice
        options: ['1', '5', '10']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scraper dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          python -m playwright install --with-deps chromium
      - name: Run parser and failure-protection tests
        run: python -m unittest test_ufcstats_parser -v
      - name: Verify bounded existing-fight sample
        env:
          REPAIR_LIMIT: ${{ inputs.limit }}
        run: python repair_history.py --limit "$REPAIR_LIMIT" --output repaired_sample
      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-repair-sample
          path: repaired_sample/
          if-no-files-found: warn
